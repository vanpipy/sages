id: audit-strict
description: Full subagent roster; worktree-only isolation; full gate suite; stricter reminders.
subagents: [Explore, Plan, developer, auditor, merger, git-expert]
isolation_default: worktree
dag_threshold: 1
gate_suite: [typecheck, test, verify:catalog, verify:profile]
soft_mode_reminder: |
  > 🛡️ **AUDIT-STRICT PROFILE — worktree isolation required**
  >
  > All subagent dispatches MUST use managed worktree isolation
  > (`isolation: { dag_id, task_id, mode: "create" }`). Direct edits to the
  > main branch are forbidden. Every merge must pass the full gate suite
  > (typecheck + test + verify:catalog + verify:profile) before landing.
  > Recommend the DAG workflow even for ≤2-item tasks because the gate
  > discipline matters.