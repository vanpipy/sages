id: standard
description: Sages default — full stack with auto-templated system prompt

# Which sibling / 3rd-party extensions are expected to be loaded.
# Conductor uses this list for tool filtering and template selection;
# the actual loading happens via pi.extensions (settings.json) — NOT here.
extensions:
  installed:
    - "@sages/pi-orchestrator"
    - "@sages/pi-subagents"
    - "@sages/pi-codebase-memory"
    - "@sages/pi-evaluator"
    - "@cortexkit/aft-pi"
    - "@cortexkit/pi-magic-context"

# Tool capabilities the LLM may call.
# Tools not listed here are blocked at the tool_call hook
# (with baseline tools — bash/read/edit/write/grep/find/ls — always allowed).
tools:
  # orchestrator
  goal_contract_create:   { enabled: true }
  dag_synthesize:         { enabled: true }
  task_dispatch:          { enabled: true }
  orchestrator_audit:     { enabled: true }
  sages_reminder:         { enabled: true }

  # subagents
  Agent:                  { enabled: true }
  get_subagent_result:    { enabled: true }
  steer_subagent:         { enabled: true }

  # codebase-memory
  codebase_memory_list_projects:   { enabled: true }
  codebase_memory_search_graph:     { enabled: true }
  codebase_memory_get_architecture: { enabled: true }

  # evaluator
  eval_score: { enabled: true }
  eval_trend: { enabled: true }

  # 3rd party
  aft_search:  { enabled: true }
  aft_outline: { enabled: true }
  aft_zoom:    { enabled: true }
  ctx_search:  { enabled: true }
  ctx_note:    { enabled: true }

# System-prompt composition. "auto" → conductor picks based on extensions.installed
prompts:
  template: auto

# Runtime policies injected by the conductor.
policies:
  soft_mode_reminder: |
    > ⚙️ **SOFT MODE — subagent dispatch recommended**
    >
    > If this is part of a larger workflow (>2 items in your active todowrite,
    > i.e. above the **task-count threshold**), consider dispatching via the
    > 4-stage DAG workflow: goal → DAG → dispatch → audit. The developer /
    > auditor / merger / git-expert pipeline is the recommended approach for
    > complex multi-step work. For ≤2 tasks (below the task-count threshold),
    > direct handling is acceptable. This is a recommendation — the agent decides.
    > No commands are blocked.