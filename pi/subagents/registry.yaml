# Subagent registry — single source of truth for all six subagent roles.
# Each entry declares its identity, capabilities, isolation, dispatch default,
# gather behavior, and required typed-artifact fields.
# Adding a subagent here makes it available at the next module load.
# GC-2026-048; run `bun run gen:catalog && bun run verify:catalog` after edits.
subagents:
  - id: Explore
    kind: read-only
    isolation: [none]
    run_in_background: false
    gather: true
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]

  - id: Plan
    kind: read-only
    isolation: [none]
    run_in_background: false
    gather: true
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]

  - id: developer
    kind: write-isolated
    isolation: [current-workspace, worktree]
    run_in_background: true
    gather: false
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]

  - id: auditor
    kind: read-only
    isolation: [none]
    run_in_background: true
    gather: false
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]

  - id: merger
    kind: write-meta
    isolation: [none]
    run_in_background: true
    gather: false
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]

  - id: git-expert
    kind: read-only
    isolation: [none, current-workspace]
    run_in_background: true
    gather: false
    artifact_schema: [status, findings, evidence, validation, open_questions, confidence, what_i_did_not_check]
