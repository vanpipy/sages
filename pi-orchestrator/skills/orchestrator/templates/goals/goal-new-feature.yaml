# Goal Template: new-feature (path B)
#
# Add a new module / endpoint / export. Use this when the user wants
# new behavior added to the codebase (not just a refactor or bug
# fix).
#
# The path B goal contract uses `done_definition` (one sentence)
# instead of path A's `success_criteria[]` + `verification_cmd`.
# The Reviewer reads `done_definition` directly and judges against it.
#
# Copy this template, fill in the bracketed `[...]` placeholders, and
# pass to `goal_contract_create`. Then `workflow_run(goal_path)`
# drives the 5-phase pipeline (Implement → Review ⇆ Fix → Merge).
#
# Example fields filled in:
#   id: "GC-2026-153"
#   title: "Add /api/v2/auth/refresh endpoint"

id: "GC-[YYYY-NNN]"
title: "[≤120 char title for the new feature]"
rationale: "[why this feature is needed; what user problem it solves]"

anti_goals:
  - "no breaking changes to existing public API"
  - "no new external dependencies"

scope:
  include:
    - "src/[module]/[new-file].ts"
    - "src/[module]/index.ts"     # re-exports
    - "test/[module]/[new-file].test.ts"
  exclude:
    - "src/[unrelated]/"

constraints:
  must_use_existing_patterns: true
  max_dependency_additions: 0
  test_coverage_min: 90
  typecheck_required: true
  lint_required: true

done_definition: |
  `[module]/[new-file].ts` exports `[function/class] [Name]` with the
  signature documented in `docs/api/[feature].md`; called from
  `[caller]` (or registered in `[route file]`); behavior verified by
  the integration test in `test/[module]/[new-file].integration.test.ts`.
