# Goal Template: add-tests (path B)
#
# Add tests only — no production code changes. Use this when a module
# lacks coverage and the user wants tests written, not a refactor.
#
# The path B goal contract uses `done_definition` (one sentence)
# instead of path A's `success_criteria[]` + `verification_cmd`.
# The Reviewer reads `done_definition` directly and judges against it.
#
# Copy this template, fill in the bracketed `[...]` placeholders, and
# pass to `goal_contract_create`. Then `workflow_run(goal_path)`
# drives the 5-phase pipeline (Implement → Review ⇆ Fix → Merge).
#
# Example fields filled in:
#   id: "GC-2026-151"
#   title: "Add unit tests for src/auth/session.ts"

id: "GC-[YYYY-NNN]"
title: "[≤120 char title for the test addition]"
rationale: "[why coverage matters; what the tests prevent]"

anti_goals:
  - "no production code changes outside test files"
  - "no new dependencies (test runners, mocks, etc.)"

scope:
  include:
    - "test/[module]/"
  exclude:
    - "src/[module]/"      # implementation is out of scope
    - "test/[unrelated]/"

constraints:
  must_use_existing_patterns: true
  max_dependency_additions: 0
  test_coverage_min: 90
  typecheck_required: true
  lint_required: true

done_definition: |
  `test/[module]/[file].test.ts` exists with [N] test cases covering
  every public export of `src/[module]/[file].ts`; line coverage of
  `src/[module]/[file].ts` rises to ≥ [X]%; all tests pass.
