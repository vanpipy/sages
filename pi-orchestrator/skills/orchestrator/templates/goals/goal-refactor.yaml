# Goal Template: refactor (path B)
#
# Restructure existing code (no behavior change). Use this when the
# user wants to clean up an existing module without changing its
# public contract.
#
# The path B goal contract uses `done_definition` (one sentence)
# instead of path A's `success_criteria[]` + `verification_cmd`.
# The Reviewer reads `done_definition` directly and judges against it.
#
# Copy this template, fill in the bracketed `[...]` placeholders, and
# pass to `goal_contract_create`. Then `workflow_run(goal_path)`
# drives the 5-phase pipeline (Implement → Review ⇆ Fix → Merge).
#
# Example fields filled in:
#   id: "GC-2026-150"
#   title: "Extract auth middleware from inline handlers"

id: "GC-[YYYY-NNN]"
title: "[≤120 char title for the refactor]"
rationale: "[why this refactor matters; what it unblocks]"

anti_goals:
  - "no behavior changes visible to callers"
  - "no new external dependencies"

scope:
  include:
    - "src/[module]/[file].ts"
  exclude:
    - "src/[unrelated]/"
    - "test/[unrelated]/"

constraints:
  must_use_existing_patterns: true
  max_dependency_additions: 0
  test_coverage_min: 90
  typecheck_required: true
  lint_required: true

done_definition: |
  The [target class/function] in `src/[module]/[file].ts` is replaced
  by [new structure]; all existing tests pass with zero modifications;
  no caller outside `src/[module]/` is affected.
