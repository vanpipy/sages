# Goal Template: fix-bug (path B)
#
# Reproduce + fix a specific bug. Use this when the user has a clear
# repro or stack trace and wants a regression test + fix.
#
# The path B goal contract uses `done_definition` (one sentence)
# instead of path A's `success_criteria[]` + `verification_cmd`.
# The Reviewer reads `done_definition` directly and judges against it.
#
# Copy this template, fill in the bracketed `[...]` placeholders, and
# pass to `goal_contract_create`. Then `workflow_run(goal_path)`
# drives the 5-phase pipeline (Implement → Review ⇆ Fix → Merge).
#
# Example fields filled in:
#   id: "GC-2026-152"
#   title: "Fix NPE on empty user list"

id: "GC-[YYYY-NNN]"
title: "[≤120 char title describing the bug]"
rationale: |
  Bug repro:
  - input: [minimal failing input]
  - observed: [current behavior]
  - expected: [correct behavior]

anti_goals:
  - "no unrelated refactors"
  - "no dependency upgrades"

scope:
  include:
    - "src/[module]/[file].ts"     # primary fix site
    - "test/[module]/[file].test.ts"  # regression test
  exclude:
    - "src/[unrelated]/"

constraints:
  must_use_existing_patterns: true
  max_dependency_additions: 0
  test_coverage_min: 90
  typecheck_required: true
  lint_required: true

done_definition: |
  Regression test `test/[module]/[file].test.ts` fails on `main` (no
  fix) and passes on the fix branch; existing test suite still passes;
  no unrelated test or production code changes outside the listed scope.
